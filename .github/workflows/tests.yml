# Unit tests (rubric extra: tests + CI)
# On every push and pull request, GitHub installs the project and runs `npm test`.
# A green tick means all the tests in tests/ passed.

name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
